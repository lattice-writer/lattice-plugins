name: Validate entries

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate entries and blocked.json
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            node scripts/validate.mjs --base "origin/$BASE_REF"
          else
            node scripts/validate.mjs
          fi
  # TEMPORARY (test branch only): prove the runner's minisign reads a minisign 0.12 unencrypted key.
  minisign-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -q && sudo apt-get install -y -q minisign && minisign -v
      - run: |
          echo probe > probe/msg
          minisign -S -s probe/throwaway.key -m probe/msg -x probe/msg.minisig -t "lattice-plugins file:msg serial:1"
          minisign -V -p probe/throwaway.pub -m probe/msg -x probe/msg.minisig
